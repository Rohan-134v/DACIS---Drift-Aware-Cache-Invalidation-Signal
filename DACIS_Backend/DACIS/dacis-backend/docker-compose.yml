version: "3.9"

services:
  dacis-backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./models:/app/models

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    # volatile-lru eviction policy: only evict keys with a TTL set,
    # using LRU ordering.  This is the policy DACIS requires for the
    # L2 embedding cache — keys without a TTL (union-find, Welford
    # stats) are never evicted.
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy volatile-lru
      --appendonly no
      --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
